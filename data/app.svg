<?xml version="1.0" encoding="UTF-8"?>
<!-- Icône de l'application : deux machines virtuelles (unités de serveur) et une pastille de restauration. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9ae3"/>
      <stop offset="1" stop-color="#1a58a3"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e5f3"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52d98d"/>
      <stop offset="1" stop-color="#1c9b53"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0a2850" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.2"/>
  <!-- deux machines virtuelles empilées -->
  <g filter="url(#shadow)">
    <rect x="22" y="21" width="66" height="27" rx="7" fill="url(#unit)"/>
    <rect x="22" y="54" width="66" height="27" rx="7" fill="url(#unit)" fill-opacity="0.93"/>
  </g>
  <circle cx="35" cy="34.5" r="4.2" fill="#2d7bcf"/>
  <circle cx="35" cy="67.5" r="4.2" fill="#2d7bcf"/>
  <rect x="46" y="31.5" width="30" height="6" rx="3" fill="#2d7bcf" fill-opacity="0.32"/>
  <rect x="46" y="64.5" width="30" height="6" rx="3" fill="#2d7bcf" fill-opacity="0.32"/>
  <!-- pastille de restauration : flèche circulaire -->
  <g filter="url(#shadow)">
    <circle cx="87" cy="89" r="28" fill="url(#badge)"/>
  </g>
  <path d="M99.5 82.5A14 14 0 1 0 100 96" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M104.5 74.5l-1.6 13.2-12.6-4.2z" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
</svg>
